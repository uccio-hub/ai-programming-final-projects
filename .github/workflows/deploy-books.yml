name: Deploy All Projects

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "01-chrome-extension/**"
      - "02-books-scraper-supabase/web/**"
      - "03-tvmaze-explorer/**"
      - ".github/workflows/deploy-books.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare all projects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site/01-chrome-extension
          mkdir -p _site/02-books-scraper-supabase
          mkdir -p _site/03-tvmaze-explorer

          cp index.html _site/index.html

          cp 01-chrome-extension/dashboard.html _site/01-chrome-extension/
          cp 01-chrome-extension/dashboard.js _site/01-chrome-extension/
          cp 01-chrome-extension/styles.css _site/01-chrome-extension/
          cp -R 01-chrome-extension/backgrounds _site/01-chrome-extension/
          cp -R 01-chrome-extension/icons _site/01-chrome-extension/

          cp -R 02-books-scraper-supabase/web _site/02-books-scraper-supabase/

          cp 03-tvmaze-explorer/index.html _site/03-tvmaze-explorer/
          cp 03-tvmaze-explorer/app.js _site/03-tvmaze-explorer/
          cp 03-tvmaze-explorer/styles.css _site/03-tvmaze-explorer/

          touch _site/.nojekyll

      - name: Upload all projects
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    name: Publish all projects
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
